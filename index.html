<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Present Continuous: The Royal Kingdom Quest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Nunito for child-friendly, clear readability -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Tone.js for magical synthesized fairytale music and sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti for royal celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --pink-light: #fff0f6;
            --pink-main: #ff70a6;
            --purple-light: #f3e8ff;
            --purple-main: #9d4edd;
            --gold-light: #fffbeb;
            --gold-main: #fbbf24;
            --gold-dark: #d97706;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 50%, #e0f2fe 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        h1, h2, h3, .font-royal {
            font-family: 'Fredoka', sans-serif;
        }

        /* Floating & Sparkle Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.7)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 1)); transform: scale(1.06); }
        }
        .animate-jewel-glow {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star-sparkle {
            animation: sparkle 2s infinite ease-in-out;
        }

        /* 3D Royal Bubble Buttons */
        .btn-royal {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
        }
        .btn-royal:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .btn-royal:active:not(:disabled) {
            top: 4px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2) !important;
        }

        .btn-pink {
            background: linear-gradient(180deg, #ff85b3 0%, #f43f8e 100%);
            box-shadow: 0 5px 0 #be185d, 0 8px 15px rgba(244, 63, 142, 0.35);
            border: 2px solid #fbcfe8;
        }
        .btn-purple {
            background: linear-gradient(180deg, #b565f2 0%, #7e22ce 100%);
            box-shadow: 0 5px 0 #581c87, 0 8px 15px rgba(126, 34, 206, 0.35);
            border: 2px solid #e9d5ff;
        }
        .btn-gold {
            background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 100%);
            box-shadow: 0 5px 0 #b45309, 0 8px 20px rgba(245, 158, 11, 0.45);
            border: 2px solid #fef3c7;
            color: #451a03;
        }
        .btn-blue {
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            box-shadow: 0 5px 0 #1d4ed8, 0 8px 15px rgba(37, 99, 235, 0.35);
            border: 2px solid #dbeafe;
        }

        /* Glassmorphic Royal Card */
        .royal-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 4px solid #ffffff;
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.15), inset 0 0 20px rgba(252, 231, 243, 0.6);
        }

        /* Treasure Chest Lid Opening Animation */
        .chest-lid {
            transform-origin: bottom center;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .chest-open .chest-lid {
            transform: rotateX(115deg) translateY(-10px);
        }

        /* Print Styles for Certificate */
        @media print {
            body * {
                visibility: hidden;
            }
            #certificate-printable, #certificate-printable * {
                visibility: visible;
            }
            #certificate-printable {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 20px;
                box-shadow: none !important;
                border: 8px double #d97706 !important;
                background: #fff9fb !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen relative">

    <!-- Ambient Decorative Background Elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute top-8 left-8 text-yellow-400 text-3xl star-sparkle">✨</div>

        <div class="absolute bottom-20 left-12 text-purple-400 text-3xl animate-float" style="animation-delay: 1s;">🌸</div>
        <div class="absolute top-1/2 right-6 text-yellow-400 text-2xl star-sparkle" style="animation-delay: 0.7s;">⭐</div>
        <div class="absolute bottom-12 right-16 text-pink-400 text-3xl animate-float" style="animation-delay: 1.5s;">🦋</div>
    </div>

    <!-- TOP NAVIGATION & PROGRESS TRACKER BAR -->
    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b-2 border-pink-200 shadow-sm px-3 py-2 md:px-6 no-print">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">

            <button onclick="navigateTo('welcome')" class="flex items-center gap-2 bg-pink-100 hover:bg-pink-200 text-pink-800 font-royal font-bold px-3 py-1.5 rounded-full text-sm md:text-base transition cursor-pointer">

                </button>
                <span class="text-purple-300">→</span>

                    <span id="jewel-badge-3">🔒</span> <span>Level 3</span>

                <button id="nav-treasure" onclick="tryAccessTreasure()" class="flex items-center gap-1 px-2 py-0.5 rounded-full transition opacity-60 cursor-not-allowed text-amber-700">

            <!-- Music Toggle & Certificate Quick Access -->
            <div class="flex items-center gap-2">
                <button onclick="navigateTo('certificate')" title="View Certificate" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-1.5 rounded-full text-xs sm:text-sm border border-amber-300 transition cursor-pointer">

    </header>

    <!-- CUSTOM MESSAGE MODAL (Replaces alert) -->
    <div id="royal-modal" class="fixed inset-0 bg-purple-950/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="royal-card rounded-3xl max-w-md w-full p-6 text-center transform transition-all scale-100">
            <div id="modal-emoji" class="text-5xl mb-3 animate-bounce">🧚‍♀️</div>

            <button onclick="closeModal()" class="btn-royal btn-pink text-white font-royal font-bold text-lg px-8 py-3 rounded-full cursor-pointer">
                GOT IT! ✨
            </button>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-viewport" class="flex-grow flex items-center justify-center p-3 sm:p-6 z-10 max-w-5xl w-full mx-auto">
        <!-- Dynamic Screens Injected Here -->
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-3 text-xs sm:text-sm text-purple-700/75 font-semibold no-print z-10">
        👑 Everglow Kingdom English Adventure • Year 3 ESL Present Continuous Quest
    </footer>

    <script>
        /* =========================================================================
           1. GAME STATE & PROGRESSION DATA
           ========================================================================= */
        const gameState = {
            currentScreen: 'welcome',
            studentName: '',
            unlockedLevels: [1], // Starts with Level 1 unlocked
            jewelsCollected: { 1: false, 2: false, 3: false },
            treasureUnlocked: false,
            musicPlaying: false,

            // Level 1 State
            lvl1Index: 0,
            lvl1Answered: false,

            // Level 2 State
            lvl2Index: 0,
            lvl2Answered: false,

            // Level 3 State (3 Sub-challenges)
            lvl3SubStage: 1, // 1: Picture Match, 2: Word Puzzle, 3: Sentence Creator
            lvl3MatchSelectedPic: null,
            lvl3MatchedPairs: [], // array of matched IDs
            lvl3PuzzleIndex: 0,
            lvl3PuzzleBuilt: [],
            lvl3PuzzleAvailable: [],
            lvl3CreatorIndex: 0,
            lvl3CreatorInputs: ['', '', ''],
            lvl3CreatorChecked: [false, false, false]
        };

        /* =========================================================================
           2. CURRICULUM CONTENT (YEAR 3 ESL PRESENT CONTINUOUS)
           ========================================================================= */
        const level1Questions = [
            {
                q: "Which sentence is correct?",
                options: [
                    { id: "A", text: "She is reading a book." },
                    { id: "B", text: "She reads a book." }
                ],
                correct: "A",
                hint: "Look for 'is' + verb-ing for an action happening right now!"
            },
            {
                q: "Which sentence describes an action happening now?",
                options: [
                    { id: "A", text: "He plays football." },
                    { id: "B", text: "He is playing football." }
                ],
                correct: "B",
                hint: "Present Continuous uses 'is' + '-ing'!"
            },
            {
                q: "Choose the Present Continuous sentence.",
                options: [
                    { id: "A", text: "They are dancing." },
                    { id: "B", text: "They dance every day." }
                ],
                correct: "A",
                hint: "They + are + verb-ing shows what they are doing right now!"
            },
            {
                q: "Which sentence is correct?",
                options: [
                    { id: "A", text: "I am eating an apple." },
                    { id: "B", text: "I eating an apple." }
                ],
                correct: "A",
                hint: "Don't forget 'am' after 'I'!"
            },
            {
                q: "Identify the correct sentence.",
                options: [
                    { id: "A", text: "The princess is singing." },
                    { id: "B", text: "The princess sings every morning." }
                ],
                correct: "A",
                hint: "The princess is doing it right now: 'is singing'!"
            }
        ];

        const level2Questions = [
            // Challenge 1: Fill in the blanks (Questions 1-5)
            {
                type: "fill",
                partTitle: "Challenge 1: Fill in the Blanks",
                promptBefore: "The boy",
                promptAfter: "to school.",
                verbHint: "(run)",
                answer: "is running",
                tip: "Remember: 'The boy' uses 'is', and 'run' doubles the 'n' → running!"
            },
            {
                type: "fill",
                partTitle: "Challenge 1: Fill in the Blanks",
                promptBefore: "The princess",
                promptAfter: "a song.",
                verbHint: "(sing)",
                answer: "is singing",
                tip: "Use 'is' + 'singing'!"
            },
            {
                type: "fill",
                partTitle: "Challenge 1: Fill in the Blanks",
                promptBefore: "They",
                promptAfter: "in the garden.",
                verbHint: "(play)",
                answer: "are playing",
                tip: "'They' is plural, so use 'are' + 'playing'!"
            },
            {
                type: "fill",
                partTitle: "Challenge 1: Fill in the Blanks",
                promptBefore: "I",
                promptAfter: "a letter.",
                verbHint: "(write)",
                answer: "am writing",
                tip: "'I' uses 'am', and 'write' drops the 'e' → writing!"
            },
            {
                type: "fill",
                partTitle: "Challenge 1: Fill in the Blanks",
                promptBefore: "We",
                promptAfter: "English.",
                verbHint: "(study)",
                answer: "are studying",
                tip: "'We' uses 'are' + 'studying'!"
            },
            // Challenge 2: Choose the correct answer (Questions 6-8)
            {
                type: "mcq",
                partTitle: "Challenge 2: Choose the Correct Answer",
                sentence: "She ______ a beautiful dress.",
                options: [
                    { id: "A", text: "am wearing" },
                    { id: "B", text: "is wearing" },
                    { id: "C", text: "are wearing" }
                ],
                correct: "B",
                tip: "For 'She', we always use 'is'!"
            },
            {
                type: "mcq",
                partTitle: "Challenge 2: Choose the Correct Answer",
                sentence: "The children ______ happily.",
                options: [
                    { id: "A", text: "are dancing" },
                    { id: "B", text: "is dancing" },
                    { id: "C", text: "am dancing" }
                ],
                correct: "A",
                tip: "'The children' means more than one child, so we use 'are'!"
            },
            {
                type: "mcq",
                partTitle: "Challenge 2: Choose the Correct Answer",
                sentence: "He ______ a bicycle.",
                options: [
                    { id: "A", text: "are riding" },
                    { id: "B", text: "am riding" },
                    { id: "C", text: "is riding" }
                ],
                correct: "C",
                tip: "For 'He', we use 'is'!"
            }
        ];

        const level3Matches = [
            { id: 1, emoji: "👧🍦", label: "Girl with ice cream", sentence: "The girl is eating ice cream." },
            { id: 2, emoji: "🏃‍♂️💨", label: "Boy running fast", sentence: "The boy is running." },
            { id: 3, emoji: "👧👦⚽", label: "Two children & ball", sentence: "The children are playing football." },
            { id: 4, emoji: "👸📖", label: "Princess with book", sentence: "The princess is reading a book." },
            { id: 5, emoji: "🏊‍♂️💦", label: "Boy in water", sentence: "The boy is swimming." }
        ];

        const level3Puzzles = [
            {
                scrambled: ["playing", "is", "She", "piano", "the"],
                answer: "She is playing the piano."
            },
            {
                scrambled: ["are", "They", "singing"],
                answer: "They are singing."
            },
            {
                scrambled: ["eating", "He", "is", "cake"],
                answer: "He is eating cake."
            }
        ];

        const level3Creators = [
            {
                emoji: "👸💃✨",
                title: "Picture 1: A princess dancing",
                placeholder: "Write a sentence about the princess...",
                suggested: "The princess is dancing.",
                keywords: ["is", "dancing"]
            },
            {
                emoji: "👦🎨🖍️",
                title: "Picture 2: A boy drawing",
                placeholder: "Write a sentence about the boy...",
                suggested: "The boy is drawing.",
                keywords: ["is", "drawing"]
            },
            {
                emoji: "👧👧🎤🎶",
                title: "Picture 3: Two girls singing",
                placeholder: "Write a sentence about the girls...",
                suggested: "The girls are singing.",
                keywords: ["are", "singing"]
            }
        ];

        /* =========================================================================
           3. SOUND EFFECTS & FAIRYTALE BACKGROUND MUSIC (TONE.JS)
           ========================================================================= */
        let bgLoop = null;
        let synth = null;

        async function initAudio() {
            if (!synth) {
                await Tone.start();
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 0.8 }
                }).toDestination();
                synth.volume.value = -10;
            }
        }

        async function playSound(type) {
            try {
                await initAudio();
                const now = Tone.now();
                if (type === 'click') {
                    synth.triggerAttackRelease("C5", "16n", now);
                } else if (type === 'correct') {
                    synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n", now);
                    setTimeout(() => synth.triggerAttackRelease(["E5", "G5", "B5", "E6"], "4n"), 140);
                } else if (type === 'wrong') {
                    synth.triggerAttackRelease(["E4", "Eb4"], "8n", now);
                } else if (type === 'jewel') {
                    const notes = ["C5", "D5", "E5", "G5", "A5", "C6"];
                    notes.forEach((n, idx) => {
                        synth.triggerAttackRelease(n, "16n", now + idx * 0.09);
                    });
                } else if (type === 'chest') {
                    const fanfare = ["C4", "E4", "G4", "C5", "E5", "G5", "C6"];
                    fanfare.forEach((n, idx) => {
                        synth.triggerAttackRelease(n, "8n", now + idx * 0.11);
                    });
                }
            } catch (e) {
                // Audio context might await user gesture
            }
        }

        async function toggleMusic() {
            await initAudio();
            const icon = document.getElementById('music-icon');
            const label = document.getElementById('music-label');

            if (!gameState.musicPlaying) {
                const melody = ["C5", "E5", "G5", "B5", "A5", "G5", "E5", "D5", "F5", "A5", "G5", "E5"];
                let step = 0;
                bgLoop = new Tone.Loop((time) => {
                    const note = melody[step % melody.length];
                    synth.triggerAttackRelease(note, "8n", time, 0.25);
                    step++;
                }, "4n").start(0);
                Tone.Transport.bpm.value = 95;
                Tone.Transport.start();
                gameState.musicPlaying = true;
                icon.textContent = "🎵";
                label.textContent = "Music ON";
            } else {
                if (bgLoop) {
                    bgLoop.stop();
                    bgLoop.dispose();
                    bgLoop = null;
                }
                Tone.Transport.stop();
                gameState.musicPlaying = false;
                icon.textContent = "🔇";
                label.textContent = "Music OFF";
            }
        }

        /* =========================================================================
           4. CUSTOM SVG ILLUSTRATIONS (ROYAL CHARACTERS, CASTLE, JEWELS, CHEST)
           ========================================================================= */
        const SVGs = {
            royalHeroes: `
                <svg viewBox="0 0 360 180" class="w-full max-w-sm mx-auto drop-shadow-md animate-float">
                    <!-- Castle Background Silhouette -->
                    <rect x="115" y="55" width="130" height="105" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="3"/>
                    <polygon points="110,55 140,20 170,55" fill="#f472b6"/>
                    <polygon points="190,55 220,20 250,55" fill="#f472b6"/>
                    <polygon points="150,45 180,5 210,45" fill="#c084fc"/>
                    <rect x="165" y="110" width="30" height="50" rx="15" fill="#fbbf24"/>
                    <!-- Princess (Left) -->
                    <g transform="translate(45, 45)">
                        <path d="M20,65 L5,115 L65,115 L50,65 Z" fill="#ff70a6" stroke="#db2777" stroke-width="2"/>
                        <circle cx="35" cy="42" r="20" fill="#fde68a"/>
                        <path d="M15,40 Q35,15 55,40" fill="#92400e"/>
                        <circle cx="28" cy="42" r="2.5" fill="#1e293b"/>
                        <circle cx="42" cy="42" r="2.5" fill="#1e293b"/>
                        <path d="M30,50 Q35,55 40,50" stroke="#db2777" stroke-width="2" fill="none"/>
                        <!-- Crown -->
                        <polygon points="23,23 28,12 35,20 42,12 47,23" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
                    </g>
                    <!-- Prince (Right) -->
                    <g transform="translate(245, 45)">
                        <rect x="18" y="65" width="34" height="50" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
                        <circle cx="35" cy="42" r="20" fill="#fde68a"/>
                        <path d="M15,36 Q35,18 55,36" fill="#451a03"/>
                        <circle cx="28" cy="42" r="2.5" fill="#1e293b"/>
                        <circle cx="42" cy="42" r="2.5" fill="#1e293b"/>
                        <path d="M30,50 Q35,55 40,50" stroke="#1d4ed8" stroke-width="2" fill="none"/>
                        <!-- Crown -->
                        <polygon points="23,23 28,12 35,20 42,12 47,23" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
                    </g>
                    <!-- Royal Fairy (Center Floating) -->
                    <g transform="translate(152, 55)">
                        <ellipse cx="14" cy="35" rx="14" ry="8" fill="#e0f2fe" opacity="0.85" transform="rotate(-25 14 35)"/>
                        <ellipse cx="42" cy="35" rx="14" ry="8" fill="#e0f2fe" opacity="0.85" transform="rotate(25 42 35)"/>
                        <path d="M20,38 L12,65 L44,65 L36,38 Z" fill="#a855f7"/>
                        <circle cx="28" cy="24" r="13" fill="#fef3c7"/>
                        <circle cx="24" cy="24" r="1.8" fill="#1e293b"/>
                        <circle cx="32" cy="24" r="1.8" fill="#1e293b"/>
                        <line x1="45" y1="45" x2="62" y2="25" stroke="#fbbf24" stroke-width="3"/>
                        <polygon points="62,18 64,23 69,23 65,26 66,31 62,28 58,31 59,26 55,23 60,23" fill="#fbbf24"/>
                    </g>
                </svg>
            `,
            jewel: (color1, color2, label) => `
                <div class="inline-flex flex-col items-center animate-jewel-glow">
                    <svg viewBox="0 0 100 100" class="w-24 h-24">
                        <polygon points="50,8 88,35 72,90 28,90 12,35" fill="${color1}" stroke="#fbbf24" stroke-width="5"/>
                        <polygon points="50,20 74,38 63,78 37,78 26,38" fill="${color2}" opacity="0.85"/>
                        <polygon points="35,28 50,20 45,38" fill="#ffffff" opacity="0.75"/>
                    </svg>
                    ${label ? `<span class="mt-1 font-royal font-bold text-amber-800 bg-amber-100 px-3 py-0.5 rounded-full text-xs border border-amber-300">${label}</span>` : ''}
                </div>
            `,
            treasureChest: (isOpen) => `

        /* =========================================================================
           5. MODAL & NAVIGATION CONTROLLERS
           ========================================================================= */
        function showModal(emoji, title, text) {
            document.getElementById('modal-emoji').textContent = emoji;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            const modal = document.getElementById('royal-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            playSound('click');
            const modal = document.getElementById('royal-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function updateProgressBar() {
            for (let lvl = 1; lvl <= 3; lvl++) {
                const navBtn = document.getElementById(`nav-lvl${lvl}`);
                const badge = document.getElementById(`jewel-badge-${lvl}`);
                const isUnlocked = gameState.unlockedLevels.includes(lvl);
                const hasJewel = gameState.jewelsCollected[lvl];

                if (hasJewel) {
                    badge.textContent = "💎";
                    navBtn.className = "flex items-center gap-1 px-2.5 py-0.5 rounded-full transition cursor-pointer bg-amber-100 text-amber-800 border border-amber-300";
                } else if (isUnlocked) {
                    badge.textContent = "✨";
                    navBtn.className = "flex items-center gap-1 px-2.5 py-0.5 rounded-full transition cursor-pointer bg-pink-100 text-pink-800 border border-pink-300";
                } else {
                    badge.textContent = "🔒";
                    navBtn.className = "flex items-center gap-1 px-2.5 py-0.5 rounded-full transition opacity-60 cursor-not-allowed text-slate-500";
                }
            }

            const treasureBtn = document.getElementById('nav-treasure');
            const allJewels = gameState.jewelsCollected[1] && gameState.jewelsCollected[2] && gameState.jewelsCollected[3];
            if (allJewels) {
                treasureBtn.className = "flex items-center gap-1 px-2.5 py-0.5 rounded-full transition cursor-pointer bg-amber-200 text-amber-900 border border-amber-400 animate-pulse";
            } else {
                treasureBtn.className = "flex items-center gap-1 px-2.5 py-0.5 rounded-full transition opacity-60 cursor-not-allowed text-amber-700";
            }
        }

        function tryAccessLevel(lvl) {
            if (gameState.unlockedLevels.includes(lvl)) {
                navigateTo(`level${lvl}`);
            } else {
                playSound('wrong');
                showModal("🔒", "Locked Royal Gate!", `Complete Level ${lvl - 1} first to collect your Golden Jewel and unlock Level ${lvl}!`);
            }
        }

        function tryAccessTreasure() {
            if (gameState.jewelsCollected[1] && gameState.jewelsCollected[2] && gameState.jewelsCollected[3]) {
                navigateTo('treasure');
            } else {
                playSound('wrong');
                showModal("👑", "The Royal Chest is Locked!", "Collect all three Golden Jewels from Levels 1, 2, and 3 to unlock the Royal Treasure Chest!");
            }
        }

        function navigateTo(screen) {
            playSound('click');
            gameState.currentScreen = screen;
            updateProgressBar();
            renderScreen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function launchConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 85,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff70a6', '#c084fc', '#fbbf24', '#38bdf8']
                });
            }
        }

            switch (gameState.currentScreen) {

                    container.innerHTML = renderHowToScreen();

                case 'level1':

                    break;
                case 'level2':
                    container.innerHTML = renderLevel2Screen();
                    break;
                case 'level3':

                    break;

                        </div>

                        <!-- Signatures & Date -->
                        <div class="grid grid-cols-2 gap-6 max-w-lg mx-auto pt-4 border-t border-purple-200 text-xs sm:text-sm font-bold text-slate-600">
                            <div>
                                <div class="text-purple-900 font-royal text-base mb-1">${today}</div>
                                <div class="border-t border-slate-400 pt-1">Date</div>
                            </div>
                            <div>
                                <div class="text-pink-600 font-royal italic text-base mb-1">Royal Fairy & Teacher</div>
                                <div class="border-t border-slate-400 pt-1">Teacher’s Signature</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function resetGame() {
            playSound('click');
            gameState.unlockedLevels = [1];
            gameState.jewelsCollected = { 1: false, 2: false, 3: false };
            gameState.treasureUnlocked = false;
            gameState.lvl1Index = 0;
            gameState.lvl1Answered = false;
            gameState.lvl2Index = 0;
            gameState.lvl2Answered = false;
            gameState.lvl3SubStage = 1;
            gameState.lvl3MatchSelectedPic = null;
            gameState.lvl3MatchedPairs = [];
            gameState.lvl3PuzzleIndex = 0;
            gameState.lvl3CreatorInputs = ['', '', ''];
            gameState.lvl3CreatorChecked = [false, false, false];
            navigateTo('welcome');
        }

        /* =========================================================================
           7. INITIALIZE APPLICATION ON WINDOW LOAD
           ========================================================================= */
        window.onload = function () {
            updateProgressBar();
            renderScreen();
        };
    </script>
</body>
</html>
